services:
  - type: web
    name: trading-portal
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ZOHO_CLIQ_WEBHOOK_BASE_URL
        value: https://cliq.zoho.in/company/60025345131/api/v2/channelsbyname/trandingalerts/message
      - key: ZOHO_CLIQ_ZAPIKEY
        sync: false
